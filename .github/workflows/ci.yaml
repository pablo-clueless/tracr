name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  js:
    name: JS (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  no-op-build:
    name: No-op build path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # A tracer reaching a production bundle is an incident. Verify it in CI,
      # not by inspection.
      - name: Build the react example for production
        run: pnpm --filter @pablo_clueless/example-react-vite build

      - name: Assert no tracr runtime in the bundle
        run: |
          if grep -rl "__tracr" examples/react-vite-app/dist; then
            echo "tracr leaked into the production bundle" >&2
            exit 1
          fi

  gates:
    name: Phase gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Phase 0: the derivation chain survives Express's own dispatch.
      - run: pnpm gate

      # Phase 1: untainted Express under 5x baseline, HMR under 500ms. Both
      # benchmarks assert the transform is actually live before reporting, so a
      # silently disabled agent fails here instead of posting a perfect score.
      - run: pnpm bench

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  integration:
    name: Agent against daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The only suite that runs a real JS agent against a real tracr-core
      # process, so it needs both toolchains and the built binary.
      - run: cargo build
      - run: pnpm test:integration
      # A short soak, not the full ten minutes the gate names: enough to catch
      # a bound regressing, cheap enough to run on every push. The real gate is
      # `pnpm soak 600`, run deliberately.
      - run: pnpm soak 60
